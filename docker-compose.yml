services:
  api:
    build:
      context: .
    image: eigora-api:dev
    container_name: eigora-api
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - .:/app
    # Reconcile the editable install against pyproject.toml on every start,
    # then serve with --reload so source edits pick up live.
    command: sh -c "pip install -e . --no-input && uvicorn eigora_api.main:app --host 0.0.0.0 --port 8000 --reload"

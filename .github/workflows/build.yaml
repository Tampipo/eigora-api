name: Tests and package CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Run tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Run tests
        run: pytest
      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py
      # Only on a real push to main: pull_request builds check out a detached
      # HEAD (refs/pull/N/merge), so there is no branch to push back to.
      - name: Commit OpenAPI schema
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "ci@github.com"
          git add openapi.yaml
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Update OpenAPI schema"
          git push



  build:
    runs-on: ubuntu-latest
    name: Build package
    needs: test
    # Only publish images for release tags -- a plain push to main just runs
    # the tests. Building/deploying on every merge was too eager: this makes
    # "merge the release-please PR" the one action that ships to prod.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/eigora-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image cache scope so api and web don't clobber each other.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Kubernetes
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: Tampipo/eigora-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install kustomize
        run: |
          curl -sLo k.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar xzf k.tgz && sudo mv kustomize /usr/local/bin/

      - name: Bump image tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${GITHUB_REF_NAME#v}"   # v1.2.3 -> 1.2.3 (matches type=semver docker tag)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cd "gitops/apps/eigora-api" \
            && kustomize edit set image "ghcr.io/$OWNER/eigora-api=ghcr.io/$OWNER/eigora-api:$TAG"


      - name: Commit and push changes
        run: |
          cd gitops 
          git diff --quiet && { echo "no image change"; exit 0; }
          git config user.name "github-actions[bot]" 
          git config user.email "github-actions[bot]@users.noreply.github.com" 
          git commit -am "deploy: ${{ github.event.repository.name }} images ${TAG}"
          git push

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eigora-api"
version = "0.2.1"
description = "FastAPI backend for the Eigora simulation platform"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Tanguy Marsault" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
    "eigora @ git+https://github.com/Tampipo/eigora",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eigora_api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=eigora_api --cov-report=term-missing"

[tool.coverage.run]
source = ["src/eigora_api"]